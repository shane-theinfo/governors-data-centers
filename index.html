<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Governors and Data Centers</title>
<style>
@font-face{font-family:"Suisse Works";src:url("fonts/SuisseWorks-Medium.otf") format("opentype");font-weight:500;font-display:swap}
@font-face{font-family:"Suisse Intl";src:url("fonts/SuisseIntl-Regular.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Suisse Intl";src:url("fonts/SuisseIntl-Medium.otf") format("opentype");font-weight:500;font-display:swap}
@font-face{font-family:"Suisse Intl Mono";src:url("fonts/SuisseIntlMono-Regular.otf") format("opentype");font-weight:400;font-display:swap}

/* House-style graphic (after The Information's Datawrapper charts): white ground, serif headline with the TI mark at right,
   one-line dek, highlight boxes that switch the position shown, hex map and a mono credit line.
   Boxes run strongest to mildest: stop building (moratorium), pull incentives (tax breaks), set conditions (two boxes).
   Each half-hexagon is filled in its party's color if that nominee backs the selected position, light gray if not stated.
   Details appear in a hover box on desktop and below the map on phones. */
:root{
  --paper:#FFFFFF; --ink:#2F3538; --ink2:#6D686E; --rule:#E6E2DB; --box:#F7F5F2; --empty:#E9E6E1; --tip:#FFFFFF;
  --dem:#2A54A3; --rep:#F32A52; --mark:#F32A52;
  --serif:"Suisse Works",Georgia,serif;
  --sans:"Suisse Intl","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"Suisse Intl Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1C1F21; --ink:#F0ECE5; --ink2:#B4B0B5; --rule:#3A3F42; --box:#26292C; --empty:#3A3E41; --tip:#26292C;
  --dem:#7F9FE6; --rep:#FF6F8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1C1F21; --ink:#F0ECE5; --ink2:#B4B0B5; --rule:#3A3F42; --box:#26292C; --empty:#3A3E41; --tip:#26292C;
  --dem:#7F9FE6; --rep:#FF6F8A; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px 32px}
.head{display:flex;justify-content:space-between;align-items:center;gap:20px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(22px,3.4vw,28px);line-height:1.1;margin:0;text-wrap:balance}
.mark{width:auto;height:24px;flex:none;fill:var(--mark)}

.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.box{display:block;width:100%;height:100%;text-align:left;font:inherit;color:inherit;background:var(--box);border:1px solid var(--box);border-top:3px solid var(--rule);padding:8px 12px 9px;cursor:pointer;border-radius:0}
.box .bl{display:block;font-weight:500;font-size:15px;line-height:1.25}
.box:hover{border-top-color:var(--ink2)}
.box[aria-pressed="true"]{background:var(--mark);color:#FFFFFF;border-color:var(--mark)}
.box:focus-visible,.st:focus-visible,.close:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.key{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;margin:16px 0 0;font-size:13px;color:var(--ink2)}
.key .q{color:var(--ink);font-weight:500;flex-basis:100%;font-size:15px}
.k{display:inline-flex;align-items:center;gap:6px}
.k .ps{display:none}
.k .nd{color:var(--dem);font-weight:500}.k .nr{color:var(--rep);font-weight:500}
.sw{width:12px;height:12px;display:inline-block;flex:none}
.sw.sl{width:16px;height:16px;color:var(--paper);font-size:11px;font-weight:500;line-height:16px;text-align:center}
.k .sl+.sl{margin-left:-4px}

.mapwrap{position:relative;margin-top:6px}
#map{width:100%;height:auto;display:block;touch-action:manipulation}
.st{cursor:pointer}
.st:focus:not(:focus-visible){outline:none}
.st .half{stroke:var(--paper);stroke-width:2.4}
.st .full{fill:none;stroke:none;pointer-events:all}
.st:hover .full{stroke:var(--ink2);stroke-width:2}
.st.on .full{stroke:var(--ink);stroke-width:3}
.st.off{cursor:default}
.st.off .full{stroke:var(--rule);stroke-width:1}
.pill{fill:var(--paper);opacity:.94;pointer-events:none}
.lbl{font:500 13px var(--sans);fill:var(--ink);pointer-events:none}
.lbl.muted{fill:var(--ink2);font-weight:400}

.tip{position:absolute;z-index:5;width:280px;background:var(--tip);border:1px solid var(--rule);border-top:2px solid var(--ink);box-shadow:0 6px 24px rgba(47,53,56,.12);padding:12px 14px;font-size:13px;line-height:1.45;pointer-events:none}
.tip[hidden]{display:none}
.tip.pinned{pointer-events:auto}
.tip h3{font:500 15px var(--sans);margin:0 28px 0 0}
.tip .c{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.tip .c:first-of-type{border-top:0;padding-top:0}
.tip .nm{font-weight:500;display:flex;align-items:center;gap:7px}
.tip .pt{font-weight:400;color:var(--ink2)}
.tip p{margin:4px 0 0}
.tip .muted{color:var(--ink2)}
.close{display:none;position:absolute;top:6px;right:6px;border:0;background:transparent;color:var(--ink2);font:400 20px var(--sans);cursor:pointer;line-height:1;padding:4px 8px}
.tip.pinned .close{display:block}

.foot{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:12px;color:var(--ink2)}
.foot p{margin:0;max-width:60ch}
.foot .src{font-family:var(--mono);font-size:11px;align-self:flex-end;text-align:right;max-width:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:700px){
  .k .pl{display:none}.k .ps{display:inline}
  .wrap{padding:20px 16px 24px}
  .head{align-items:flex-start}
  .mark{margin-top:4px}
  .tiers{grid-template-columns:1fr 1fr}
  .tip,.tip.pinned{position:relative;left:auto!important;top:auto!important;width:auto;box-shadow:none;margin-top:8px;pointer-events:auto}
  .tip .close{display:block}
  .foot .src{align-self:flex-start;text-align:left}
}
@media (max-width:420px){.tiers{gap:10px 8px}.box{padding:7px 9px 8px}.box .bl{font-size:13px}}
</style>
</head>

const VIEWS=TIERS.flatMap(t=>t.views);
const NO=v=>v.no||"No/Not stated";
const ans=(v,c)=>v.yes(c)?"Yes":NO(v);
let view=VIEWS[0],sel=null;
const fill=(c,p)=>view.yes(c)?`var(--${p==="D"?"dem":"rep"})`:"var(--empty)";

// highlight boxes
const tiers=document.getElementById("tiers");
for(const v of VIEWS){
    const b=document.createElement("button");b.type="button";b.className="box";b.dataset.k=v.k;
    b.innerHTML=`<span class="bl">${esc(v.label)}</span>`;
    b.onclick=()=>{view=v;render()};tiers.appendChild(b)}

// map
const R=34,W=Math.sqrt(3)*R;
const pos=D.layout.map(([a,r,c])=>({a,x:W*(c+.5*(r%2))+W/2,y:R*1.5*r+R}));
svg.setAttribute("viewBox",`0 0 ${Math.max(...pos.map(p=>p.x))+W/2} ${Math.max(...pos.map(p=>p.y))+R}`);
const el=(n,at,p)=>{const e=document.createElementNS(NS,n);for(const k in at)e.setAttribute(k,at[k]);(p||svg).appendChild(e);return e};
const hx=(cx,cy)=>[[cx,cy-R],[cx+W/2,cy-R/2],[cx+W/2,cy+R/2],[cx,cy+R],[cx-W/2,cy+R/2],[cx-W/2,cy-R/2]];
const pts=a=>a.map(p=>p.join(",")).join(" ");
for(const p of pos){
  const r=races[p.a],g=el("g",{class:"st"+(r?"":" off"),"data-a":p.a});
  if(r){
    g.setAttribute("tabindex","0");g.setAttribute("role","button");
    el("polygon",{class:"half hD",points:pts([[p.x,p.y-R],[p.x-W/2,p.y-R/2],[p.x-W/2,p.y+R/2],[p.x,p.y+R]])},g);
    el("polygon",{class:"half hR",points:pts([[p.x,p.y-R],[p.x+W/2,p.y-R/2],[p.x+W/2,p.y+R/2],[p.x,p.y+R]])},g);
    el("polygon",{class:"full",points:pts(hx(p.x,p.y))},g);
    el("rect",{class:"pill",x:p.x-15,y:p.y-9,width:30,height:18},g);
    // mouse: hover previews, click pins. touch and keyboard: tap/Enter pins.
    g.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse"&&!sel)show(p.a)});
    g.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"&&!sel)hide()});
    g.addEventListener("click",()=>select(p.a));
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(p.a)}});
  }else el("polygon",{class:"full",points:pts(hx(p.x,p.y))},g);
  const t=el("text",{class:"lbl"+(r?"":" muted"),x:p.x,y:p.y,"text-anchor":"middle",dy:"0.35em"},g);t.textContent=p.a}

// hover box
function candHtml(c){
  return`<div class="c"><div class="nm"><span class="sw" style="background:${fill(c,c.p)}"></span>${esc(c.n)} <span class="pt">${c.p}${c.inc?", incumbent":""}</span></div>`+
    `</div>`}
function place(a){
  if(matchMedia("(max-width:700px)").matches){tip.style.left=tip.style.top="";return}
  const g=svg.querySelector(`.st[data-a="${a}"]`).getBoundingClientRect(),w=wrap.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let x=g.right-w.left+10;if(x+tw>w.width)x=g.left-w.left-tw-10;if(x<0)x=Math.max(0,(w.width-tw)/2);
  let y=g.top-w.top-10;y=Math.max(0,Math.min(y,w.height-th));
  tip.style.left=x+"px";tip.style.top=y+"px"}
function show(a){const r=races[a];tbody.innerHTML=`<h3>${esc(r.state)}</h3>`+r.cands.map(candHtml).join("");tip.hidden=false;place(a)}
function hide(){tip.hidden=true;tip.classList.remove("pinned")}
function select(a){sel=sel===a?null:a;svg.querySelectorAll(".st.on").forEach(q=>q.classList.remove("on"));
  if(sel){svg.querySelector(`.st[data-a="${sel}"]`).classList.add("on");show(sel);tip.classList.add("pinned")}else hide()}
document.getElementById("close").onclick=()=>{if(sel)select(sel)};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sel)select(sel)});
document.addEventListener("click",e=>{if(sel&&!e.target.closest(".st")&&!e.target.closest(".tip")&&!e.target.closest(".box"))select(sel)});

// screen-reader table: every nominee's answer to every position
const head=document.querySelector("#tbl thead tr");
for(const v of VIEWS){const th=document.createElement("th");th.scope="col";th.textContent=v.label;head.appendChild(th)}
const tb=document.querySelector("#tbl tbody");
for(const r of D.races)for(const c of r.cands){const tr=document.createElement("tr");
  tr.innerHTML=`<td>${esc(r.state)}</td><td>${esc(c.n)}${c.inc?" (incumbent)":""}</td><td>${PN[c.p]}</td>`+VIEWS.map(v=>`<td>${ans(v,c)}</td>`).join("");tb.appendChild(tr)}

function render(){
  tiers.querySelectorAll(".box").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===view.k)));
  svg.querySelectorAll(".st:not(.off)").forEach(g=>{const r=races[g.dataset.a];
    g.querySelector(".hD").style.fill=fill(r.cands[0],"D");g.querySelector(".hR").style.fill=fill(r.cands[1],"R");
    g.setAttribute("aria-label",`${r.state}: `+r.cands.map(c=>`${c.n} (${c.p}), ${ans(view,c).toLowerCase()}`).join("; "))});
  const y=all.filter(view.yes).length;
  document.getElementById("key").innerHTML=`<span class="q">${esc(view.q)}</span>`+
    `<span class="k"><span class="sw sl" aria-hidden="true" style="background:var(--dem)">D</span><span class="sw sl" aria-hidden="true" style="background:var(--rep)">R</span><span>Yes – ${y}</span></span>`+
    `<span class="k"><span class="sw" style="background:var(--empty)"></span>${NO(view)} – ${all.length-y}</span>`+
    `<span class="k"><span class="sw" style="border:1px solid var(--rule)"></span>No race</span>`;
  if(!tip.hidden&&sel)show(sel)}
render();
})();
</script>
</body>
</html>
